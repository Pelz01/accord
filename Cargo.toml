[workspace]
members = ["contracts/vault", "contracts/test-token"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "=5.29.1", default-features = false }
near-contract-standards = "=5.29.1"
borsh = "1.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
